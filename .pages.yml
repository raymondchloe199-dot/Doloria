              "fields": [
                {
                  "name": "photo",
                  "label": "Photo",
                  "type": "image",
                  "options": {
                    "extensions": [
                      "jpg",
                      "jpeg",
                      "png",
                      "webp"
                    ]
                  }
                },
                {
                  "name": "descriptionPhoto",
                  "label": "Description de la photo",
                  "type": "string",
                  "required": true
                }
              ]
            },
            {
              "name": "une",
              "label": "Mettre à la une",
              "type": "boolean",
              "default": false,
              "description": "Si plusieurs articles sont cochés, le plus récent est placé à la une."
